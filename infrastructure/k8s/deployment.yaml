apiVersion: apps/v1
kind: Deployment
metadata:
  name: aquor-web
  labels:
    app: aquor-web
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aquor-web
  template:
    metadata:
      labels:
        app: aquor-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/gajetoso/aquor-web:latest # replaced by CI with the git SHA tag
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: aquor-web-config
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: aquor-web
spec:
  selector:
    app: aquor-web
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aquor-web-config
data:
  NEXT_TELEMETRY_DISABLED: "1"
  # Public runtime config only — secrets belong in a Secret + external secret store.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aquor-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aquor-web
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aquor-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [www.aquor.com]
      secretName: aquor-web-tls
  rules:
    - host: www.aquor.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aquor-web
                port:
                  number: 80

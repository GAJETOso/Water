# Reverse proxy for self-hosted deployments (behind Cloudflare).
# TLS terminates here with certs from certbot/cert-manager.

worker_processes auto;

events { worker_connections 2048; }

http {
    include       mime.types;
    sendfile      on;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;

    upstream web {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name www.aquor.com aquor.com;
        return 301 https://www.aquor.com$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.aquor.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        location /_next/static/ {
            proxy_pass http://web;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            limit_req zone=perip burst=60 nodelay;
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}

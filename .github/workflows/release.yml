name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: Build & publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aquor-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/aquor-web:latest

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Create release notes from tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # Production deploy: add your provider step here (Vercel/EKS/Cloud Run).
  # deploy:
  #   needs: docker
  #   environment: production
  #   ...

name: 📖 Documentation
description: Report missing, unclear or incorrect documentation
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Which document?
      placeholder: docs/DEPLOYMENT.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What's wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
